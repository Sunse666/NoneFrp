# nginx site for the relay control plane.
# Drop it into /etc/nginx/sites-enabled/ and run certbot, or copy the ssl block
# from an existing site that already has a certificate.
#
#   server_name relay.example.com;
#   certbot --nginx -d relay.example.com
#
# The players' port (25565) is served by the relay itself and never passes
# through nginx.

server {
    listen 80;
    listen [::]:80;
    server_name relay.example.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        # Websocket upgrade for the agent control connection.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The control connection is meant to stay open for a long time.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
